name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  PROJECT_NAME: bcn_profiles
  PROJECT_DIR: /opt/apps/bcn_profiles
  IMAGE_NAME: ghcr.io/bcn-org/bcn_profiles

jobs:
  ci:
    name: Test, Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: E2E test
        run: npm run test:e2e -- --runInBand

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test production environment and compose
        run: node --test scripts/generate-production-env.test.mjs

      - name: Build
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy Production
    needs: ci
    runs-on: [self-hosted, linux, production, docker, bcn-org]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js for environment validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate and validate production environment
        env:
          PRODUCTION_VARS: ${{ toJSON(vars) }}
          PRODUCTION_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -eu
          mkdir -p "$PROJECT_DIR"
          rm -f "$PROJECT_DIR/.env.rollback" "$PROJECT_DIR/.env.compose.rollback" "$PROJECT_DIR/docker-compose.yml.rollback"
          node scripts/generate-production-env.mjs "$RUNNER_TEMP/production.env"
          docker network inspect bcn-infra >/dev/null
          # Back up only deployments already on shared infrastructure.
          # The legacy stack and its database volumes must remain available.
          if [ -f "$PROJECT_DIR/docker-compose.yml" ] && [ -f "$PROJECT_DIR/.env" ] && \
             [ -f "$PROJECT_DIR/.env.compose" ] && grep -q 'bcn-infra' "$PROJECT_DIR/docker-compose.yml"; then
            cp -p "$PROJECT_DIR/.env" "$PROJECT_DIR/.env.rollback"
            cp -p "$PROJECT_DIR/.env.compose" "$PROJECT_DIR/.env.compose.rollback"
            cp -p "$PROJECT_DIR/docker-compose.yml" "$PROJECT_DIR/docker-compose.yml.rollback"
          fi
          cp "$RUNNER_TEMP/production.env" "$PROJECT_DIR/.env"
          cp "$RUNNER_TEMP/production.env.compose" "$PROJECT_DIR/.env.compose"
          chmod 600 "$PROJECT_DIR/.env" "$PROJECT_DIR/.env.compose"
          cp docker-compose.prod.yml "$PROJECT_DIR/docker-compose.yml"
          cd "$PROJECT_DIR"
          docker compose --env-file .env.compose config --quiet

      - name: Pull image
        run: |
          set -eu
          cd "$PROJECT_DIR"
          docker compose --env-file .env.compose pull

      - name: Run application database migration
        run: |
          set -eu
          cd "$PROJECT_DIR"
          docker compose --env-file .env.compose run --rm --no-deps --entrypoint npx app prisma migrate deploy

      - name: Deploy
        id: deploy
        run: |
          set -eu
          cd "$PROJECT_DIR"
          docker compose --env-file .env.compose up -d app

      - name: Health check
        id: health
        env:
          HOST_PORT_VALUE: ${{ vars.HOST_PORT }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${HOST_PORT_VALUE}/health" >/dev/null; then
              echo "Application is healthy"
              exit 0
            fi
            echo "Health check attempt ${attempt}/30 failed"
            sleep 2
          done

          echo "Health check failed"
          docker logs "$PROJECT_NAME" --tail 100 || true
          exit 1


      - name: Restore previous shared-infrastructure application
        if: ${{ failure() }}
        run: |
          set -eu
          cd "$PROJECT_DIR"
          if [ -f .env.rollback ] && [ -f .env.compose.rollback ] && [ -f docker-compose.yml.rollback ]; then
            cp -p .env.rollback .env
            cp -p .env.compose.rollback .env.compose
            cp -p docker-compose.yml.rollback docker-compose.yml
            docker compose --env-file .env.compose up -d app
            docker compose --env-file .env.compose exec -T app node -e "fetch('http://127.0.0.1:' + process.env.APP_PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
          fi

      - name: Remove rollback configuration after success
        if: ${{ success() }}
        run: rm -f "$PROJECT_DIR/.env.rollback" "$PROJECT_DIR/.env.compose.rollback" "$PROJECT_DIR/docker-compose.yml.rollback"
