# Production uses infrastructure managed separately by the server admin.
services:
  app:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: bcn_profiles
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    ports:
      - '127.0.0.1:${HOST_PORT:?HOST_PORT is required}:${APP_PORT:?APP_PORT is required}'
    networks:
      - bcn-infra
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + process.env.APP_PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 20s

networks:
  bcn-infra:
    external: true
